<form method="post" action="{% url 'accounts:setting' %}" enctype="multipart/form-data">
  {% csrf_token %}
  <div>
    <label for="name">名前</label>
    <input value="{{ request.user.name }}" name="name" type="text" required="required" />
  </div>

  <div>
    <label for="email">メールアドレス</label>
    <input value="{{ request.user.email }}" name="email" type="email" />
  </div>

  <div>
    <label for="password">パスワード</label>
    <input value="{{ request.user.password }}" name="password" type="password"></input>
  </div>

  <div>
    <label for="icon">アイコン</label>
    <input type="file" name="icon" />
  </div>

  <div>
    <button type="submit">保存</button>
  </div>
</form>

<form method="POST" action="{% url 'logout' %}">
  {% csrf_token %}
  <button type="submit">ログアウト</button>
</form>
