{% extends "layouts/public_base.html" %}

{% block title %}機能紹介: 質問投稿 | RareTECHナレッジ掲示板{% endblock %}

{% block content %}
<section class="max-w-4xl mx-auto px-4 py-12">
  <div class="bg-[#fff7ed] rounded-2xl border-2 border-[#7c2808] shadow-xl p-8 md:p-10 space-y-6">
    <h1 class="text-3xl font-bold text-[#7c2808]">機能紹介: 質問投稿</h1>
    <p class="text-[#7c2808] leading-8">マークダウンエディタを利用して、コード付きの質問を整理して投稿できます。下書き段階でプレビュー確認ができるため、読みやすい質問を作成しやすくなります。</p>
    <ul class="list-disc pl-6 text-[#7c2808] leading-8">
      <li>カテゴリを選択して投稿先を明確化</li>
      <li>マークダウンでコード・リンク・画像を記述</li>
      <li>投稿前プレビューで体裁確認</li>
    </ul>
  </div>
</section>
{% endblock %}
