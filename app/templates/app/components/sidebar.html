<aside class="hidden lg:flex lg:flex-col lg:w-64 lg:sticky lg:top-0 lg:h-screen lg:self-start overflow-y-auto bg-[#fff7ed] border-r border-[#7c2808]/20 min-h-screen">
  <div class="p-6 border-b border-[#7c2808]/20">
    <div class="bg-[#7c2808] text-[#fff7ed] rounded-lg px-3 py-2 inline-flex items-center gap-2">
      <span class="text-sm font-bold">RareTECH</span>
      <span class="text-xs text-[#fff7ed]/80">ナレッジ掲示板</span>
    </div>
    <p class="mt-3 text-xs text-[#7c2808]/80">ナレッジ共有ワークスペース</p>
  </div>

  <nav class="px-4 py-4 space-y-2 text-sm"
    _="
      on load
        send updateNavState to me
      end
      on htmx:afterSettle from <body/>
        send updateNavState to me
      end
      on popstate from <window/>
        send updateNavState to me
      end
      on updateNavState
        set :p to window.location.pathname
        set :active to null
        if :p matches '^/question/new/'
          set :active to 'new'
        else if :p matches '^/my-questions/'
          set :active to 'my'
        else if :p matches '^/how-to-ask/'
          set :active to 'ask'
        else if :p matches '^/bookmarks/' or :p matches '^/bookmark/'
          set :active to 'bookmarks'
        else if :p matches '^/setting/'
          set :active to 'setting'
        else if :p matches '^/home/' or :p matches '^/question/'
          set :active to 'home'
        end
        for link in <[data-nav-item]/>
          if link's @data-nav-item is :active
            add .sidebar-active to link
            remove .sidebar-inactive from link
          else
            remove .sidebar-active from link
            add .sidebar-inactive to link
          end
        end
    ">
    <a href="/home/" 
      data-nav-item="home"
      class="sidebar-item sidebar-inactive flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-[#fff7ed]"
      hx-get="/home/"
      hx-target="main"
      hx-select="main"
      hx-swap="outerHTML show:window:top"
      hx-push-url="true"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a4 4 0 0 1-4 4H7l-4 4V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z" />
      </svg>
      質問一覧
    </a>
    <a href="/question/new/"
      data-nav-item="new"
      class="sidebar-item sidebar-inactive flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-[#fff7ed]"
      hx-get="/question/new/"
      hx-target="main"
      hx-select="main"
      hx-swap="outerHTML show:window:top"
      hx-push-url="true"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 2 11 13" />
        <path d="M22 2 15 22l-4-9-9-4 20-7z" />
      </svg>
      質問投稿
    </a>
    <a href="/my-questions/"
      data-nav-item="my"
      class="sidebar-item sidebar-inactive flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-[#fff7ed]"
      hx-get="/my-questions/"
      hx-target="main"
      hx-select="main"
      hx-swap="outerHTML show:window:top"
      hx-push-url="true"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a4 4 0 0 1-4 4H7l-4 4V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z" />
      </svg>
      自分の質問
    </a>
    <a href="/how-to-ask/"
      data-nav-item="ask"
      class="sidebar-item sidebar-inactive flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-[#fff7ed]"
      hx-get="/how-to-ask/"
      hx-target="main"
      hx-select="main"
      hx-swap="outerHTML show:window:top"
      hx-push-url="true"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 7v7" />
        <circle cx="12" cy="17" r="1" fill="currentColor" stroke="none" />
      </svg>
      いい質問の仕方
    </a>
    <a href="/bookmarks/"
      data-nav-item="bookmarks"
      class="sidebar-item sidebar-inactive flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-[#fff7ed]"
      hx-get="/bookmarks/"
      hx-target="main"
      hx-select="main"
      hx-swap="outerHTML show:window:top"
      hx-push-url="true"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
      </svg>
      ブックマーク
    </a>
    <a href="/setting/"
      data-nav-item="setting"
      class="sidebar-item sidebar-inactive flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-[#fff7ed]"
      hx-get="/setting/"
      hx-target="main"
      hx-select="main"
      hx-swap="outerHTML show:window:top"
      hx-push-url="true"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
      マイページ
    </a>
  </nav>

  <div class="mt-auto p-4 border-t border-[#7c2808]/20">
    <a href="/logout/"
      class="w-full inline-flex items-center justify-center px-3 py-2 text-sm rounded-lg border border-[#7c2808] text-[#7c2808] hover:bg-[#7c2808] hover:text-[#fff7ed] transition-colors"
      hx-get="/logout/"
      hx-target="main"
      hx-select="main"
      hx-swap="outerHTML show:window:top"
      hx-push-url="true"
      >
      <svg class="w-4 h-4 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <path d="m16 17 5-5-5-5" />
        <path d="M21 12H9" />
      </svg>
      ログアウト
    </a>
  </div>
</aside>
