{# 【ファイル責務】Markdown本文入力とプレビュー表示 #}
<div id="{{ editor_pane_id }}">
  <textarea id="{{ editor_id }}"
            name="{{ editor_name }}"
            rows="{{ rows|default:'10' }}" required
            data-markdown-editor="1"
            _="on keydown[key is 'Tab' and not shiftKey]
                halt the event
                set start to my.selectionStart
                set finish to my.selectionEnd
                set currentValue to my.value
                set my.value to currentValue.substring(0, start) + '\t' + currentValue.substring(finish)
                set my.selectionStart to start + 1
                set my.selectionEnd to start + 1"
            class="w-full px-4 py-3 border-2 border-[#7c2808] rounded-lg focus:outline-none focus:border-[#c93400] bg-white text-[#7c2808] {{ editor_min_h|default:'min-h-[220px]' }} resize-y font-mono text-sm"
            placeholder="{{ editor_placeholder|default:'マークダウン形式で入力してください' }}">{{ editor_value|default:'' }}</textarea>
</div>
{# 【セクション】Markdownプレビューペイン #}
<div id="{{ preview_pane_id }}" class="hidden border-2 border-[#7c2808]/20 rounded-lg bg-white p-4 min-h-[220px] overflow-auto">
  <div id="{{ preview_id }}" class="text-[#7c2808] text-sm leading-7 [&_h1]:text-2xl [&_h1]:font-bold [&_h1]:mb-3 [&_h2]:text-xl [&_h2]:font-bold [&_h2]:mb-2 [&_h3]:text-lg [&_h3]:font-bold [&_h3]:mb-2 [&_p]:mb-3 [&_ul]:list-disc [&_ul]:pl-6 [&_ol]:list-decimal [&_ol]:pl-6 [&_li]:mb-1 [&_pre]:bg-[#7c2808] [&_pre]:text-[#fff7ed] [&_pre]:p-3 [&_pre]:rounded-lg [&_pre]:overflow-auto [&_code]:bg-[#7c2808]/10 [&_code]:px-1 [&_code]:rounded [&_blockquote]:border-l-4 [&_blockquote]:border-[#c93400] [&_blockquote]:pl-3 [&_blockquote]:text-[#8c3f27]"></div>
</div>
