<div class="flex flex-wrap gap-2 mb-3 bg-[#7c2808]/5 border border-[#7c2808]/20 rounded-lg p-2">
  <button type="button" class="p-2 hover:bg-[#7c2808]/10 rounded transition-colors text-sm" title="見出し1"
    _="on click set #{{ editor_id }}.value to #{{ editor_id }}.value + '\n# 見出し1\n\n' then focus() on #{{ editor_id }}">
    <span class="text-[#7c2808]">
      {% include "app/components/icons/h1.svg" with icon_class="w-5 h-5" %}
    </span>
  </button>
  <button type="button" class="p-2 hover:bg-[#7c2808]/10 rounded transition-colors text-sm" title="見出し2"
    _="on click set #{{ editor_id }}.value to #{{ editor_id }}.value + '\n## 見出し2\n\n' then focus() on #{{ editor_id }}">
    <span class="text-[#7c2808]">
      {% include "app/components/icons/h2.svg" with icon_class="w-5 h-5" %}
    </span>
  </button>
  <button type="button" class="p-2 hover:bg-[#7c2808]/10 rounded transition-colors text-sm font-bold" title="太字"
    _="on click set #{{ editor_id }}.value to #{{ editor_id }}.value + '**太字**' then focus() on #{{ editor_id }}">
    <span class="text-[#7c2808]">
      {% include "app/components/icons/bold.svg" with icon_class="w-5 h-5" %}
    </span>
  </button>
  <button type="button" class="p-2 hover:bg-[#7c2808]/10 rounded transition-colors" title="斜体"
    _="on click set #{{ editor_id }}.value to #{{ editor_id }}.value + '*斜体*' then focus() on #{{ editor_id }}">
    <span class="text-[#7c2808]">
      {% include "app/components/icons/italic.svg" with icon_class="w-5 h-5" %}
    </span>
  </button>
  <button type="button" class="p-2 hover:bg-[#7c2808]/10 rounded transition-colors" title="コード"
    _="on click set #{{ editor_id }}.value to #{{ editor_id }}.value + '`コード`' then focus() on #{{ editor_id }}">
    <span class="text-[#7c2808]">
      {% include "app/components/icons/code-bracket.svg" with icon_class="w-5 h-5" %}
    </span>
  </button>
  <button type="button" class="p-2 hover:bg-[#7c2808]/10 rounded transition-colors text-sm" title="コードブロック" _="on click set #{{ editor_id }}.value to #{{ editor_id }}.value + '\n```\nコードブロック\n```\n\n' then focus() on #{{ editor_id }}">{ }</button>
  <button type="button" class="p-2 hover:bg-[#7c2808]/10 rounded transition-colors" title="箇条書き"
    _="on click set #{{ editor_id }}.value to #{{ editor_id }}.value + '\n- リスト項目\n' then focus() on #{{ editor_id }}">
    <span class="text-[#7c2808]">
      {% include "app/components/icons/list.svg" with icon_class="w-5 h-5" %}
    </span>
  </button>
  <button type="button" class="p-2 hover:bg-[#7c2808]/10 rounded transition-colors" title="番号リスト"
    _="on click set #{{ editor_id }}.value to #{{ editor_id }}.value + '\n1. リスト項目\n' then focus() on #{{ editor_id }}">
    <span class="text-[#7c2808]">
      {% include "app/components/icons/list-ordered.svg" with icon_class="w-5 h-5" %}
    </span>
  </button>
  <button type="button" class="p-2 hover:bg-[#7c2808]/10 rounded transition-colors" title="リンク" _="on click set #{{ editor_id }}.value to #{{ editor_id }}.value + '[リンクテキスト](https://example.com)' then focus() on #{{ editor_id }}">
    <span class="text-[#7c2808]">
      {% include "app/components/icons/link.svg" with icon_class="w-5 h-5" %}
    </span>
  </button>
  <label for="{{ upload_picker_id }}" class="p-2 hover:bg-[#7c2808]/10 rounded transition-colors cursor-pointer" title="画像">
    <span class="text-[#7c2808]">
      {% include "app/components/icons/image.svg" with icon_class="w-5 h-5" %}
    </span>
  </label>
</div>
