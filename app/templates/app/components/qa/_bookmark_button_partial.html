{# 【ファイル責務】質問カード内ブックマーク切り替えボタン #}
<form method="post"
      action="/question/{{ q.id }}/bookmark/"
      hx-post="/question/{{ q.id }}/bookmark/"
      hx-target="this"
      hx-swap="outerHTML"
      hx-select="form"
      hx-push-url="false"
      class="inline-block"
      hx-on:click="event.stopPropagation()">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit"
          class="p-2 hover:bg-[#7c2808]/10 rounded-lg transition-colors"
          title="お気に入り"
          hx-on:click="event.stopPropagation()"
          aria-pressed="{% if is_bookmarked or q.id in bookmarked_question_ids %}true{% else %}false{% endif %}">
    {% if is_bookmarked or q.id in bookmarked_question_ids %}
      <span class="text-[#c93400]">
        {% include "app/components/icons/bookmark-filled.svg" with icon_class="w-6 h-6" %}
      </span>
    {% else %}
      <span class="text-[#7c2808]">
        {% include "app/components/icons/bookmark.svg" with icon_class="w-6 h-6" %}
      </span>
    {% endif %}
  </button>
</form>
