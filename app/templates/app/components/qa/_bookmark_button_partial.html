<form method="post"
      action="/question/{{ q.id }}/bookmark/"
      hx-post="/question/{{ q.id }}/bookmark/"
      hx-target="this"
      hx-swap="outerHTML"
      hx-select="form"
      hx-push-url="false"
      class="inline-block"
      hx-on:click="event.stopPropagation()">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" class="p-2 hover:bg-[#7c2808]/10 rounded-lg transition-colors" title="お気に入り"
          hx-on:click="event.stopPropagation()"
          aria-pressed="{% if is_bookmarked or q.id in bookmarked_question_ids %}true{% else %}false{% endif %}">
    {% if is_bookmarked or q.id in bookmarked_question_ids %}
      <svg class="w-6 h-6 text-[#c93400]" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
      </svg>
    {% else %}
      <svg class="w-6 h-6 text-[#7c2808]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
      </svg>
    {% endif %}
  </button>
</form>
