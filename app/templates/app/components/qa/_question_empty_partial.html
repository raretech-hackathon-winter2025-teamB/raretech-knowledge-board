<div class="bg-[#fff7ed] rounded-xl border-2 border-[#7c2808] p-10 shadow-md text-center">
  {% if show_icon %}
    <span class="text-[#7c2808]/80 mx-auto mb-4 inline-flex">
      {% include "app/components/icons/chat.svg" with icon_class="w-14 h-14" %}
    </span>
  {% endif %}
  <p class="text-[#7c2808] text-lg mb-2">{{ empty_title }}</p>
  <p class="text-[#7c2808]/80 text-sm">{{ empty_message }}</p>
</div>
