{# 【ファイル責務】カテゴリとステータス絞り込みモーダル表示 #}
<div id="{{ modal_id }}" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" _="on click if event.target == me then add .hidden to me">
  <div class="bg-[#fff7ed] rounded-2xl shadow-2xl max-w-md w-full border-2 border-[#7c2808]">
    <div class="bg-[#7c2808] text-[#fff7ed] px-6 py-4 flex items-center justify-between rounded-t-xl">
      <h3 class="text-xl font-bold">絞り込み</h3>
      <button type="button"
              class="p-1 hover:bg-[#c93400] rounded transition-colors"
              _="on click add .hidden to #{{ modal_id }}">
        {% include "app/components/icons/close.svg" with icon_class="w-6 h-6" %}
      </button>
    </div>
    {# 【遷移】適用時にmain領域を更新してモーダルを閉じる #}
    <form method="get"
          action="{{ form_action }}"
          class="p-6 space-y-5"
          hx-get="{{ hx_get_url }}"
          hx-target="main"
          hx-select="main"
          hx-swap="outerHTML show:window:top"
          hx-push-url="true"
          _="on submit add .hidden to #{{ modal_id }}">
      <input type="hidden" name="q" value="{{ selected_q }}">
      <div>
        <label class="block mb-2 font-bold text-[#7c2808]">カテゴリ</label>
        <select name="category" class="w-full px-4 py-3 border-2 border-[#7c2808] rounded-lg focus:outline-none focus:border-[#c93400] bg-white text-[#7c2808]">
          <option value="">すべて</option>
          {% for name in categories %}
            <option value="{{ name }}" {% if selected_category == name %}selected{% endif %}>{{ name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block mb-2 font-bold text-[#7c2808]">ステータス</label>
        <div class="space-y-2 text-sm">
          <label class="flex items-center gap-2 p-2 border-2 border-[#7c2808] rounded-lg"><input type="radio" name="status" value="" {% if not selected_status %}checked{% endif %}>すべて</label>
          <label class="flex items-center gap-2 p-2 border-2 border-[#7c2808] rounded-lg"><input type="radio" name="status" value="2" {% if selected_status == '2' %}checked{% endif %}>未解決のみ</label>
          <label class="flex items-center gap-2 p-2 border-2 border-[#7c2808] rounded-lg"><input type="radio" name="status" value="1" {% if selected_status == '1' %}checked{% endif %}>解決済みのみ</label>
        </div>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="button"
                class="flex-1 px-4 py-3 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition-colors font-medium"
                _="on click add .hidden to #{{ modal_id }}">
          キャンセル
        </button>
        <button type="submit"
                class="flex-1 px-4 py-3 bg-[#c93400] text-[#fff7ed] rounded-lg hover:bg-[#7c2808] transition-colors font-medium">
          適用
        </button>
      </div>
    </form>
  </div>
</div>
