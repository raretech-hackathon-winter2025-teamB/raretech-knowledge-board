{% extends "layouts/app_base.html" %}

{% block title %}質問投稿 | RareTECHナレッジ掲示板{% endblock %}
{% block extra_head %}
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
{% endblock %}

{% block content %}
<section class="space-y-5">
  <div class="bg-[#7c2808] text-[#fff7ed] rounded-2xl px-8 py-6 flex items-center justify-between w-full shadow-lg">
    <div class="flex items-center gap-3">
      <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 2 11 13" />
        <path d="M22 2 15 22l-4-9-9-4 20-7z" />
      </svg>
      <h1 class="text-2xl font-bold">質問を投稿</h1>
    </div>
    <a href="/home/" class="px-4 py-2 bg-[#c93400] text-[#fff7ed] rounded-lg hover:bg-[#fff7ed] hover:text-[#7c2808] transition-colors font-bold">
      一覧へ戻る
    </a>
  </div>

  {% if form.errors %}
    <div class="bg-[#fff7ed] border-2 border-red-600 rounded-lg p-4 text-sm text-red-700">
      入力内容を確認してください。
      {{ form.errors }}
    </div>
  {% endif %}

  <form method="post" action="/question/new/" class="space-y-5"
        hx-post="/question/new/" hx-target="main" hx-select="main" hx-swap="outerHTML" hx-push-url="true">
    {% csrf_token %}

    <div class="bg-[#fff7ed] rounded-xl border-2 border-[#7c2808] p-6 shadow-md">
      <label class="block mb-3 font-bold text-[#7c2808] text-lg">
        <span class="text-[#c93400]">*</span>
        カテゴリ
      </label>
      <select name="category" id="id_category" class="w-full px-4 py-3 border-2 border-[#7c2808] rounded-lg focus:outline-none focus:border-[#c93400] bg-white text-[#7c2808]" required>
        <option value="">カテゴリを選択してください</option>
        {% for c in categories %}
          <option value="{{ c.pk }}" {% if form.category.value|stringformat:"s" == c.pk|stringformat:"s" %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="bg-[#fff7ed] rounded-xl border-2 border-[#7c2808] p-6 shadow-md">
      <label for="id_title" class="block mb-3 font-bold text-[#7c2808] text-lg">
        <span class="text-[#c93400]">*</span>
        タイトル
      </label>
      <input id="id_title" name="title" type="text" value="{{ form.title.value|default:'' }}" class="w-full px-4 py-3 border-2 border-[#7c2808] rounded-lg focus:outline-none focus:border-[#c93400] bg-white text-[#7c2808]" placeholder="質問のタイトルを入力" required>
    </div>

    <div class="bg-[#fff7ed] rounded-xl border-2 border-[#7c2808] p-6 shadow-md">
      <div class="flex items-center justify-between mb-3">
        <label for="id_detail" class="font-bold text-[#7c2808] text-lg">
          <span class="text-[#c93400]">*</span>
          質問内容
        </label>
        <a href="/how-to-ask/" class="text-sm text-[#c93400] underline">いい質問の仕方</a>
      </div>

      <div class="flex gap-2 mb-3 border-b-2 border-[#7c2808]/20 pb-2">
        <button type="button" class="px-3 py-1 text-sm border border-[#7c2808] rounded"
                _="on click remove .hidden from #editor-pane add .hidden to #preview-pane">編集</button>
        <button type="button" class="px-3 py-1 text-sm border border-[#7c2808] rounded"
                _="on click call window.renderMarkdownPreview() add .hidden to #editor-pane remove .hidden from #preview-pane">プレビュー</button>
      </div>

      <div class="flex flex-wrap gap-2 mb-3 bg-[#7c2808]/5 border border-[#7c2808]/20 rounded-lg p-2">
        <button type="button" class="px-2 py-1 text-xs border border-[#7c2808]/30 rounded" _="on click call window.insertAround('**','**')">太字</button>
        <button type="button" class="px-2 py-1 text-xs border border-[#7c2808]/30 rounded" _="on click call window.insertAround('*','*')">斜体</button>
        <button type="button" class="px-2 py-1 text-xs border border-[#7c2808]/30 rounded" _="on click call window.insertAround('`','`')">コード</button>
        <button type="button" class="px-2 py-1 text-xs border border-[#7c2808]/30 rounded" _="on click call window.insertText('\n- リスト項目\n')">箇条書き</button>
        <button type="button" class="px-2 py-1 text-xs border border-[#7c2808]/30 rounded" _="on click call window.insertText('\n1. リスト項目\n')">番号リスト</button>
        <button type="button" class="px-2 py-1 text-xs border border-[#7c2808]/30 rounded" _="on click call window.insertText('\n```\nコード\n```\n')">コードブロック</button>
      </div>

      <div id="editor-pane">
        <textarea id="id_detail" name="detail" rows="12" class="w-full px-4 py-3 border-2 border-[#7c2808] rounded-lg focus:outline-none focus:border-[#c93400] bg-white text-[#7c2808]" placeholder="問題の背景、再現手順、エラーメッセージを具体的に書いてください" required>{{ form.detail.value|default:'' }}</textarea>
      </div>
      <div id="preview-pane" class="hidden border-2 border-[#7c2808]/20 rounded-lg bg-white p-4 min-h-[220px] overflow-auto">
        <div id="preview-content" class="text-[#7c2808] text-sm leading-7 [&_h1]:text-2xl [&_h1]:font-bold [&_h1]:mb-3 [&_h2]:text-xl [&_h2]:font-bold [&_h2]:mb-2 [&_h3]:text-lg [&_h3]:font-bold [&_h3]:mb-2 [&_p]:mb-3 [&_ul]:list-disc [&_ul]:pl-6 [&_ol]:list-decimal [&_ol]:pl-6 [&_li]:mb-1 [&_pre]:bg-[#7c2808] [&_pre]:text-[#fff7ed] [&_pre]:p-3 [&_pre]:rounded-lg [&_pre]:overflow-auto [&_code]:bg-[#7c2808]/10 [&_code]:px-1 [&_code]:rounded [&_blockquote]:border-l-4 [&_blockquote]:border-[#c93400] [&_blockquote]:pl-3 [&_blockquote]:text-[#8c3f27]"></div>
      </div>
    </div>

    <div class="bg-[#fff7ed] rounded-xl border-2 border-[#7c2808] p-6 shadow-md">
      <label for="id_image_url" class="block mb-3 font-bold text-[#7c2808] text-lg">画像URL（任意）</label>
      <input id="id_image_url" name="image_url" type="url" value="{{ form.image_url.value|default:'' }}" class="w-full px-4 py-3 border-2 border-[#7c2808] rounded-lg focus:outline-none focus:border-[#c93400] bg-white text-[#7c2808]" placeholder="https://example.com/image.png">
    </div>

    <div class="flex gap-3 justify-end">
      <a href="/home/" class="px-6 py-3 border-2 border-[#7c2808] text-[#7c2808] rounded-lg hover:bg-[#7c2808] hover:text-[#fff7ed] transition-colors font-medium">キャンセル</a>
      <button type="submit" class="px-6 py-3 bg-[#c93400] text-[#fff7ed] rounded-lg hover:bg-[#7c2808] transition-colors font-bold">
        投稿する
      </button>
    </div>
  </form>
</section>

<script>
  (function () {
    function insertAtCursor(textarea, text) {
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const value = textarea.value;
      textarea.value = value.slice(0, start) + text + value.slice(end);
      const next = start + text.length;
      textarea.focus();
      textarea.setSelectionRange(next, next);
    }

    window.insertText = function (text) {
      const textarea = document.getElementById('id_detail');
      if (!textarea) return;
      insertAtCursor(textarea, text);
    };

    window.insertAround = function (prefix, suffix) {
      const textarea = document.getElementById('id_detail');
      if (!textarea) return;
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const value = textarea.value;
      const selected = value.slice(start, end) || 'テキスト';
      textarea.value = value.slice(0, start) + prefix + selected + suffix + value.slice(end);
      textarea.focus();
      const s = start + prefix.length;
      textarea.setSelectionRange(s, s + selected.length);
    };

    window.renderMarkdownPreview = function () {
      const textarea = document.getElementById('id_detail');
      const preview = document.getElementById('preview-content');
      if (!textarea || !preview) return;

      const source = textarea.value || '';

      if (window.marked) {
        marked.setOptions({
          gfm: true,
          breaks: true,
        });
        const html = marked.parse(source);
        preview.innerHTML = window.DOMPurify ? DOMPurify.sanitize(html) : html;
        return;
      }

      preview.textContent = source;
    };
  })();
</script>
{% endblock %}
