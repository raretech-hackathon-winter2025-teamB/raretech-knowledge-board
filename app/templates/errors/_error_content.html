<section id="error-panel" class="w-full max-w-2xl">
  <div class="bg-white rounded-2xl border-2 border-[#7c2808] shadow-2xl overflow-hidden">
    <header class="bg-[#7c2808] text-[#fff7ed] px-6 py-5 text-center">
      <p class="text-4xl font-bold">{{ status_code }}</p>
      <h1 class="text-xl font-bold mt-2">{{ status_title }}</h1>
    </header>

    <div class="px-6 py-6 space-y-4">
      <p class="text-[#7c2808] leading-7">{{ status_message }}</p>
      <p class="text-sm text-[#7c2808]/70">
        リクエストパス: <code class="font-mono">{{ request_path }}</code>
      </p>

      <div class="flex flex-wrap gap-3 pt-2">
        <a href="/"
           class="px-4 py-2 rounded-lg bg-[#c93400] text-[#fff7ed] hover:bg-[#7c2808] transition-colors font-bold">
          トップへ戻る
        </a>
        <button type="button"
                class="px-4 py-2 rounded-lg border-2 border-[#7c2808] text-[#7c2808] hover:bg-[#7c2808] hover:text-[#fff7ed] transition-colors font-bold"
                _="on click call history.back()">
          前の画面へ戻る
        </button>
        {% if show_retry %}
          <button type="button"
                  class="px-4 py-2 rounded-lg border-2 border-[#c93400] text-[#c93400] hover:bg-[#c93400] hover:text-[#fff7ed] transition-colors font-bold"
                  _="on click call location.reload()">
            再読み込み
          </button>
        {% endif %}
      </div>
    </div>
  </div>
</section>
